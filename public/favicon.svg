<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradiente Dourado Nobre -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="35%" stop-color="#f5d76e"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997b1e"/>
    </linearGradient>

    <!-- Fundo Escuro Obsidiana -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </linearGradient>

    <!-- Glow Sutil -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#d4af37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo arredondado elegante -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#2a2a2e" stroke-width="2"/>

  <!-- Ícone de Livro Aberto Estilizado com Efeito Dourado -->
  <g filter="url(#goldGlow)">
    <!-- Páginas Esquerdas do Livro -->
    <path d="M32 46 C24 41 16 42 12 44 V20 C16 18 24 17 32 22 Z" 
          fill="url(#goldGrad)" opacity="0.95"/>

    <!-- Páginas Direitas do Livro -->
    <path d="M32 46 C40 41 48 42 52 44 V20 C48 18 40 17 32 22 Z" 
          fill="url(#goldGrad)" opacity="0.95"/>

    <!-- Lombada / Vinco Central -->
    <path d="M32 22 V47" stroke="#131315" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Linhas Sutis de Texto/Folhas na Página Esquerda -->
    <path d="M17 26 C21 24.5 25 25 28 26.5 M17 31 C21 29.5 25 30 28 31.5 M17 36 C21 34.5 25 35 28 36.5" 
          stroke="#131315" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>

    <!-- Linhas Sutis de Texto/Folhas na Página Direita -->
    <path d="M36 26.5 C39 25 43 24.5 47 26 M36 31.5 C39 30 43 29.5 47 31 M36 36.5 C39 35 43 34.5 47 36" 
          stroke="#131315" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>

    <!-- Marcador de Página / Fita Dourada Superior -->
    <path d="M32 22 V31 L34 29 L36 31 V22" fill="#fff0a6" opacity="0.8"/>
  </g>
</svg>
