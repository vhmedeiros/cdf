services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cdf-prod-db
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdf_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cdf_production}
    volumes:
      - cdf_prod_pgdata:/var/lib/postgresql/data
    networks:
      - cdf-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cdf_prod_user} -d ${POSTGRES_DB:-cdf_production}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cdf-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - cdf_prod_redis:/data
    networks:
      - cdf-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cdf-app:prod
    container_name: cdf-prod-migrate
    command: ["npx", "node-pg-migrate", "--migrations-dir", "infra/migrations", "up"]
    env_file:
      - ../.env.production
    volumes:
      - ./:/app/infra
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cdf-network
    profiles:
      - tools

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cdf-app:prod
    container_name: cdf-prod-web
    restart: unless-stopped
    command: ["node", "server.js"]
    env_file:
      - ../.env.production
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - STREAM_MODE=nginx
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - cdf_prod_media:/app/.cache/media
      - ../secrets:/run/secrets:ro
      - ../secrets:/app/secrets:ro
    networks:
      - cdf-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/status > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    image: cdf-app:prod
    container_name: cdf-prod-worker
    restart: unless-stopped
    command: ["node", "dist/worker/index.js"]
    env_file:
      - ../.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - cdf_prod_media:/app/.cache/media
      - ../secrets:/run/secrets:ro
      - ../secrets:/app/secrets:ro
    networks:
      - cdf-network

  nginx:
    image: nginx:alpine
    container_name: cdf-prod-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - cdf_prod_media:/var/cache/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - cdf-network
      - web

volumes:
  cdf_prod_pgdata:
  cdf_prod_redis:
  cdf_prod_media:

networks:
  cdf-network:
    driver: bridge
  web:
    external: true
