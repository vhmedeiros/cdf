# Rate limiting para proteção contra ataques de força bruta no login
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

# DNS embutido do Docker: re-resolve o hostname do web a cada 10s.
# Evita 502 quando o container web é recriado e ganha outro IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream nextjs_upstream {
    zone nextjs_upstream 64k;
    server web:3000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Compressão Gzip
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Cabeçalhos de Segurança (OWASP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache estático imutável para assets do Next.js
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service Worker nunca pode ficar preso no cache HTTP
    location = /sw.js {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Cache de arquivos estáticos públicos
    location ~* ^/(favicon\.ico|manifest\.json)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Proteção de rate limit em rotas de login
    location = /api/v1/sessions {
        limit_req zone=login_limit burst=10 nodelay;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin de cursos: preview e sync podem varrer pastas grandes do Drive
    location ^~ /api/v1/admin/courses {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Streaming de mídia: sem buffering para reduzir o tempo até o primeiro byte
    location /api/v1/stream/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Location interna para streaming via X-Accel-Redirect
    location /_drive/ {
        internal;
        alias /var/cache/media/;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;

        # Suporte a Range Requests HTTP 206 para seek de vídeo
        add_header Accept-Ranges bytes;
    }

    # Rota padrão: proxy para o servidor standalone do Next.js
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
