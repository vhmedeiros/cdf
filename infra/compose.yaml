services:
  database:
    image: pgvector/pgvector:pg17
    container_name: cdf-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-local_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_password}
      POSTGRES_DB: ${POSTGRES_DB:-local_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-local_user} -d ${POSTGRES_DB:-local_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cdf-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailcatcher:
    image: sj26/mailcatcher
    container_name: cdf-mailcatcher
    ports:
      - "1025:1025" # SMTP
      - "1080:1080" # Web UI

  docling:
    image: ghcr.io/ds4sd/docling-serve:latest
    container_name: cdf-docling
    profiles:
      - pdf
    ports:
      - "5001:5001"

volumes:
  postgres-data:
  redis-data:
